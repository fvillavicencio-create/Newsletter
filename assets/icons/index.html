<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iconografía Regcheq</title>
<style>
  :root { --ink:#0a2342; --blue:#368fff; --sky:#bcd9ff; --sun:#f4c542; --mint:#7fd8aa; --bg:#f7f9fc; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family: Arial, Helvetica, sans-serif; }
  header { padding:40px 24px 8px; max-width:1100px; margin:0 auto; }
  h1 { margin:0; font-size:30px; }
  p { margin:8px 0 0; color:#5a6b7d; }
  .palette { display:flex; gap:10px; flex-wrap:wrap; margin-top:18px; }
  .palette span { display:flex; align-items:center; gap:6px; font-size:12px; }
  .palette i { width:22px; height:22px; border-radius:50%; border:2px solid var(--ink); }
  main { max-width:1100px; margin:0 auto; padding:24px; display:grid; gap:18px;
         grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); }
  figure { margin:0; background:#fff; border-radius:18px; padding:18px 10px 14px; text-align:center;
           box-shadow:0 2px 10px rgba(10,35,66,.06); }
  img { width:96px; height:96px; }
  figcaption { font-size:13px; font-weight:700; margin-top:6px; }
  figcaption span { display:block; font-weight:400; font-size:11px; color:#7a8ba0; margin-top:2px; }
</style></head><body>
<header><h1>Iconografía Regcheq</h1>
<p>Estilo dibujado a mano, cercano y amigable. Trazo azul marino + manchas de color de marca.</p>
<div class="palette">
  <span><i style="background:#0a2342"></i>#0A2342</span><span><i style="background:#368fff"></i>#368FFF</span>
  <span><i style="background:#bcd9ff"></i>#BCD9FF</span><span><i style="background:#f4c542"></i>#F4C542</span>
  <span><i style="background:#7fd8aa"></i>#7FD8AA</span>
</div></header>
<main><figure><img src="svg/cumplimiento.svg" alt="Cumplimiento"><figcaption>Cumplimiento<span>cumplimiento</span></figcaption></figure><figure><img src="svg/revision-documental.svg" alt="Revisión documental"><figcaption>Revisión documental<span>revision-documental</span></figcaption></figure><figure><img src="svg/identificacion.svg" alt="Identificación (KYC)"><figcaption>Identificación (KYC)<span>identificacion</span></figcaption></figure><figure><img src="svg/checklist.svg" alt="Checklist"><figcaption>Checklist<span>checklist</span></figcaption></figure><figure><img src="svg/alertas.svg" alt="Alertas y avisos"><figcaption>Alertas y avisos<span>alertas</span></figcaption></figure><figure><img src="svg/monitoreo.svg" alt="Monitoreo"><figcaption>Monitoreo<span>monitoreo</span></figcaption></figure><figure><img src="svg/metricas.svg" alt="Métricas y reportes"><figcaption>Métricas y reportes<span>metricas</span></figcaption></figure><figure><img src="svg/beneficiario-controlador.svg" alt="Beneficiario controlador"><figcaption>Beneficiario controlador<span>beneficiario-controlador</span></figcaption></figure><figure><img src="svg/proteccion-datos.svg" alt="Protección de datos"><figcaption>Protección de datos<span>proteccion-datos</span></figcaption></figure><figure><img src="svg/en-la-practica.svg" alt="En la práctica"><figcaption>En la práctica<span>en-la-practica</span></figcaption></figure><figure><img src="svg/hablemos.svg" alt="Hablemos"><figcaption>Hablemos<span>hablemos</span></figcaption></figure><figure><img src="svg/plataforma.svg" alt="Plataforma Regcheq"><figcaption>Plataforma Regcheq<span>plataforma</span></figcaption></figure><figure><img src="svg/fechas-clave.svg" alt="Fechas clave"><figcaption>Fechas clave<span>fechas-clave</span></figcaption></figure><figure><img src="svg/novedades.svg" alt="Novedades"><figcaption>Novedades<span>novedades</span></figcaption></figure><figure><img src="svg/webinar.svg" alt="Webinars y eventos"><figcaption>Webinars y eventos<span>webinar</span></figcaption></figure><figure><img src="svg/blog.svg" alt="Blog"><figcaption>Blog<span>blog</span></figcaption></figure><figure><img src="svg/tip.svg" alt="Tip / idea"><figcaption>Tip / idea<span>tip</span></figcaption></figure><figure><img src="svg/descargable.svg" alt="Recurso descargable"><figcaption>Recurso descargable<span>descargable</span></figcaption></figure><figure><img src="svg/regulacion.svg" alt="Regulación / Ley"><figcaption>Regulación / Ley<span>regulacion</span></figcaption></figure><figure><img src="svg/institucion.svg" alt="Institución financiera"><figcaption>Institución financiera<span>institucion</span></figcaption></figure><figure><img src="svg/listas-restrictivas.svg" alt="Búsqueda en listas"><figcaption>Búsqueda en listas<span>listas-restrictivas</span></figcaption></figure><figure><img src="svg/newsletter.svg" alt="Newsletter"><figcaption>Newsletter<span>newsletter</span></figcaption></figure><figure><img src="svg/logro.svg" alt="Logro / certificación"><figcaption>Logro / certificación<span>logro</span></figcaption></figure><figure><img src="svg/lanzamiento.svg" alt="Lanzamiento"><figcaption>Lanzamiento<span>lanzamiento</span></figcaption></figure></main>
</body></html>
